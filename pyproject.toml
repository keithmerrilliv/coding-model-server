[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-model-server"
version = "0.1.0"
description = "Coding Model multi-agent FastAPI inference server, autonomous orchestrator, and chat client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Keith Merrill" }]

# Server-side dependencies (mirrors the historical requirements.txt).
# Client-only deps live under the optional `client` extra; install with
#   pip install -e .[client]
# to add them. The chat client itself runs without anything beyond the
# core requests + python-dotenv that ship with the server profile.
dependencies = [
    "fastapi>=0.128.1",
    "uvicorn[standard]>=0.40.0",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "chromadb==1.4.1",
    "sentence-transformers==5.2.2",
    "pypdf>=5.1.0",
    # Soft + unmaintained: no wheel exists for Python 3.13+, so the marker keeps
    # `pip install -e .` working on newer interpreters (DEV-441). code_chunker
    # degrades to simple chunking when it is absent.
    "tree_sitter_languages; python_version < '3.13'",
    "ddgs>=9.10.0",
    "pyyaml>=6.0",
    # Soft: orchestrator falls back to FakeJiraClient if missing.
    "atlassian-python-api>=4.0.0",
    # Soft: /review and Phase b skip the relevant judge if missing or unkeyed.
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    # Soft: the subscription-auth Claude judge (external_judges.call_claude_sdk);
    # shells out to the Claude Code CLI, which must be installed separately.
    "claude-agent-sdk>=0.2.0",
]

[project.optional-dependencies]
client = [
    "rich>=13.0",
    "beautifulsoup4>=4.12",
]
# scripts/download_models.py only; not needed at runtime (inference runs
# through an external llama-server, not in-process).
scripts = [
    "huggingface-hub>=1.4.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
    "mypy>=1.11",
]

[project.scripts]
# CLIs users invoke directly. Server + orchestrator are systemd-managed and
# use `python -m coding_model_server.server` / `python -m coding_model_server.orchestrator_daemon`,
# so they don't need console_scripts entries.
coding-model-client = "coding_model_client.main:main"
coding-model-autonomous = "coding_model_client.autonomous:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["coding_model_server*", "coding_model_client*", "coding_model_autonomous*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
# Scoped deliberately (DEV-169): type-hint coverage is bimodal, and these
# two packages are already at 98-100% annotated. Gating them locks that in
# without drowning CI in the 40-49% packages' pre-existing findings —
# ratchet coding_model_server / coding_model_client in later.
files = ["src/coding_model_autonomous", "mac_runner"]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# CI gates on correctness only (undefined names, unused imports/variables,
# syntax errors). Style rules are deliberately out of scope — this codebase
# predates the linter and a style sweep would bury real regressions.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Package roots re-export their public API.
"**/__init__.py" = ["F401"]
