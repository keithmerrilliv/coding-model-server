[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-server"
version = "0.1.0"
description = "Qwen multi-agent FastAPI inference server, autonomous orchestrator, and chat client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Keith Merrill" }]

# Server-side dependencies (mirrors the historical requirements.txt).
# Client-only deps live under the optional `client` extra; install with
#   pip install -e .[client]
# to add them. The chat client itself runs without anything beyond the
# core requests + python-dotenv that ship with the server profile.
dependencies = [
    "llama-cpp-python>=0.3.20",
    "transformers>=5.1.0",
    "huggingface-hub>=1.4.0",
    "fastapi>=0.128.1",
    "uvicorn[standard]>=0.40.0",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "chromadb==1.4.1",
    "sentence-transformers==5.2.2",
    "pypdf>=5.1.0",
    "tree_sitter_languages",
    "ddgs>=9.10.0",
    "pyyaml>=6.0",
    # Soft: orchestrator falls back to FakeJiraClient if missing.
    "atlassian-python-api>=4.0.0",
    # Soft: /review and Phase b skip the relevant judge if missing or unkeyed.
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
client = [
    "rich>=13.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
# CLIs users invoke directly. Server + orchestrator are systemd-managed and
# use `python -m qwen_server.server` / `python -m qwen_server.orchestrator_daemon`,
# so they don't need console_scripts entries.
qwen-client = "qwen_client.main:main"
qwen-autonomous = "qwen_client.autonomous:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["qwen_server*", "qwen_client*", "qwen_autonomous*"]
