# Registered-repo map for the Mac runner.
# Copy to ~/.config/qwen-runner/repos.yml and fill in for your projects.
#
# Each entry maps a short symbolic name (used in spec YAML) to an absolute
# path on this Mac. The runner refuses to operate on any path that isn't
# listed here — this prevents a misbehaving planner from pointing the
# runner at arbitrary filesystem locations.

repos:
  character-sync:
    path: ~/Dev/OnePlanet/Character-SYNC

  scene-reconstruction:
    path: ~/Dev/OnePlanet/SceneReconstruction

  electric-sheep:
    path: ~/Dev/Metal/ElectricSheep

  llab:
    path: ~/Dev/Metal/LLab

  # Add one entry per project you want the orchestrator to be able to test.
